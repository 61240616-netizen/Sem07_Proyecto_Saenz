<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Actualizar Envío</title>
  <link rel="stylesheet" href="css/actualizar.css">
</head>
<body>
  <h2>Modificar Cotización</h2>
  <form id="form-actualizar">
    <label>Origen: <input type="text" id="edit-origen" required></label>
    <label>Destino: <input type="text" id="edit-destino" required></label>
    <label>Peso: <input type="number" step="0.1" id="edit-peso" required></label>
    <button type="submit" id="btn-guardar">Actualizar</button>
  </form>
  <script type="module" src="js/actualizar/actualizar.js"></script>
</body>
</html>
